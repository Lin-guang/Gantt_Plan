<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">甘特图工作台核心流程</title>
  <desc id="desc">从表格快速排期，到依赖和关键路径联动，再到钉钉文本绘图与图片输出。</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#173b78" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#7f92b8"/>
    </marker>
  </defs>
  <rect width="1200" height="280" rx="24" fill="#f5f8fe"/>
  <text x="600" y="37" text-anchor="middle" font-family="system-ui,'Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#1f2d47">从计划输入到可分享甘特图，只需三步</text>

  <g filter="url(#shadow)">
    <rect x="54" y="66" width="300" height="158" rx="18" fill="#ffffff" stroke="#cfd9ee"/>
    <rect x="450" y="66" width="300" height="158" rx="18" fill="#ffffff" stroke="#cfd9ee"/>
    <rect x="846" y="66" width="300" height="158" rx="18" fill="#ffffff" stroke="#cfd9ee"/>
  </g>

  <g transform="translate(82 92)">
    <rect width="52" height="52" rx="13" fill="#e8f0ff"/>
    <path d="M12 14h28M12 25h28M12 36h28M20 10v32M32 10v32" fill="none" stroke="#356df3" stroke-width="2.2" stroke-linecap="round"/>
  </g>
  <text x="151" y="110" font-family="system-ui,'Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#20304d">表格快速排期</text>
  <text x="82" y="164" font-family="system-ui,'Microsoft YaHei',sans-serif" font-size="15" fill="#5c6f91">日期、负责人、工期、里程碑</text>
  <text x="82" y="190" font-family="system-ui,'Microsoft YaHei',sans-serif" font-size="15" fill="#5c6f91">适合短期项目快速搭建计划</text>

  <g transform="translate(478 92)">
    <rect width="52" height="52" rx="13" fill="#e7f8f8"/>
    <circle cx="14" cy="14" r="5" fill="#119a9a"/>
    <circle cx="39" cy="27" r="5" fill="#119a9a"/>
    <circle cx="14" cy="40" r="5" fill="#119a9a"/>
    <path d="M18 16l16 8M18 38l16-8" fill="none" stroke="#119a9a" stroke-width="2.4"/>
  </g>
  <text x="547" y="110" font-family="system-ui,'Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#20304d">依赖自动联动</text>
  <text x="478" y="164" font-family="system-ui,'Microsoft YaHei',sans-serif" font-size="15" fill="#5c6f91">前置任务、独立间隔、关键路径</text>
  <text x="478" y="190" font-family="system-ui,'Microsoft YaHei',sans-serif" font-size="15" fill="#5c6f91">日期变化自动传递，减少手工计算</text>

  <g transform="translate(874 92)">
    <rect width="52" height="52" rx="13" fill="#f1eaff"/>
    <path d="M14 13h24v27H14zM20 21h12M20 27h12M20 33h8" fill="none" stroke="#7755c8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="943" y="110" font-family="system-ui,'Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#20304d">一键输出分享</text>
  <text x="874" y="164" font-family="system-ui,'Microsoft YaHei',sans-serif" font-size="15" fill="#5c6f91">钉钉文本绘图、Mermaid、PNG</text>
  <text x="874" y="190" font-family="system-ui,'Microsoft YaHei',sans-serif" font-size="15" fill="#5c6f91">复制代码即可用于协作与汇报</text>

  <path d="M370 145H430" stroke="#7f92b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M766 145H826" stroke="#7f92b8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <g transform="translate(356 244)">
    <rect width="488" height="26" rx="13" fill="#e9effa"/>
    <text x="244" y="18" text-anchor="middle" font-family="system-ui,'Microsoft YaHei',sans-serif" font-size="13" font-weight="600" fill="#50678e">无需安装 · 在线与离线均可 · 数据保存在浏览器本地</text>
  </g>
</svg>
